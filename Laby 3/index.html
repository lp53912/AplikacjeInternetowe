<!-- index.html -->
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LAB C — Mapa (krok 6: pobierz mapę)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <!-- eksport mapy -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; padding: 0; }
    #controls { padding: 10px; display:flex; gap:8px; align-items:center; }
    #map { width: 100%; height: 60vh; }
    #stol { width: 100%; height: 30vh; border-top: 1px solid #ddd; display:flex; flex-wrap:wrap; gap:6px; padding:8px; box-sizing:border-box; }
    .puzzle-piece { width: calc(25% - 12px); height: calc(100%/4 - 12px); border:1px dashed #999; display:flex; align-items:center; justify-content:center; background:#f7f7f7; }
    button { padding:8px 12px; border-radius:6px; border:1px solid #bbb; background:white; cursor:pointer; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="locBtn">Moja lokalizacja</button>
    <button id="downloadBtn">Pobierz mapę</button>
    <button id="notifyBtn">Zgoda na powiadomienia</button>
    <div id="coords" aria-live="polite"></div>
  </div>

  <div id="map" role="application" aria-label="Mapa"></div>
  <div id="stol" aria-label="Stół do układania puzzli"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Twój główny skrypt -->
  <script src="script.js"></script>
</body>
</html>
